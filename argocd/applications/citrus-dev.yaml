apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: citrus-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: splattop
  source:
    repoURL: https://github.com/cesaregarza/GarzAICluster
    targetRevision: main
    path: helm/citrus
    helm:
      releaseName: citrus-dev
      valueFiles:
        - values.yaml
        - values-dev.yaml
        - values-payment-dev.yaml
        - values-recurring-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: citrus-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # PostSync release gates must execute after both image-bump and self-heal
      # syncs. ApplyOutOfSyncOnly selectively skips hook resources.
  revisionHistoryLimit: 10
