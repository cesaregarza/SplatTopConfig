global:
  imagePullSecrets:
    - regcred
  runtimeSecretName: agent-control-plane-secrets

nameOverride: agent-control-plane
fullnameOverride: agent-control-plane

replicaCount: 1

# Match the guarded live singleton budget explicitly in the rendered chart.
rollingUpdate:
  maxSurge: 0
  maxUnavailable: 1

apiServiceAccount:
  create: true
  name: agent-control-plane-tokenreview
  automountServiceAccountToken: false
  annotations: {}

workloadIdentity:
  kubernetesTokenReview:
    enabled: true
    apiServerUrl: https://kubernetes.default.svc
    reviewerTokenAudience: ""
    tokenMountPath: /var/run/mandate/tokenreview/token
    caMountPath: /var/run/mandate/tokenreview/ca.crt
    tokenExpirationSeconds: 3600
    timeoutSeconds: 5.0

apiPodAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9090"
  prometheus.io/path: /metrics

metrics:
  enabled: true
  port: 9090

image:
  repository: registry.digitalocean.com/sendouq/agent-platform
  tag: sha-a5b1db23009c
  digest: sha256:3f815a6121546c3f416b8e1680baa5799486d8851455637b28991116b8f3068f
  pullPolicy: IfNotPresent

secretKeys:
  - AGENT_PLATFORM_DATABASE_URL
  - AGENT_PLATFORM_OPENCLAW_TOKEN
  - AGENT_PLATFORM_TRUSTED_EDGE_TOKEN
  - AGENT_PLATFORM_INTERNAL_WORKER_TOKEN
  - AGENT_PLATFORM_WORKER_SERVICE_TOKEN
  - AGENT_PLATFORM_APPROVAL_TOKEN
  - AGENT_PLATFORM_AUDIT_READ_TOKEN
  - AGENT_PLATFORM_AUDIT_WRITE_TOKEN
  - AGENT_PLATFORM_READONLY_SQL_DATABASE_URL
  - AGENT_PLATFORM_READONLY_SQL_ANALYTICAL_DATABASE_URL
  - AGENT_PLATFORM_MODEL_GATEWAY_TOKEN_SECRET
  - AGENT_PLATFORM_MODEL_GATEWAY_CODEX_AUTH_JSON
  - AGENT_PLATFORM_WORKLOAD_IDENTITY_HMAC_SECRET
  - AGENT_PLATFORM_MCP_TRUSTED_CONTEXT_HMAC_SECRET

apiExtraSecretRefs:
  - secretName: agent-control-plane-hermes-mctx
    keys:
      - AGENT_PLATFORM_MCP_TRUSTED_CONTEXT_HMAC_SECONDARY_SECRET

env:
  AGENT_PLATFORM_ENVIRONMENT: prod
  AGENT_PLATFORM_PROVIDER_DIGEST_PINS_JSON: '{"model_gateway":{"digest":"sha256:2010eb78000580e9bc9ad74b57b70500318014a397193133005fae153b39c336","protocol":"model_gateway"},"readonly-sql-broker":{"digest":"sha256:73203a3ff8309cb762966f7559abf871f46a239c3136e7a5658eb069f52066c1","protocol":"readonly_sql"}}'
  AGENT_PLATFORM_OUTPUT_GATE_BACKEND: patch_aware
  AGENT_PLATFORM_POSTGRES_POOL_MIN_SIZE: "0"
  AGENT_PLATFORM_POSTGRES_POOL_MAX_SIZE: "2"
  AGENT_PLATFORM_READONLY_SQL_POOL_MIN_SIZE: "0"
  AGENT_PLATFORM_READONLY_SQL_POOL_MAX_SIZE: "1"
  AGENT_PLATFORM_MODEL_GATEWAY_BACKEND: codex_chatgpt_responses
  AGENT_PLATFORM_MODEL_GATEWAY_TIMEOUT_SECONDS: "90"
  AGENT_PLATFORM_MODEL_GATEWAY_KILL_SWITCH_FILE: /app/model-gateway-controls/kill-switch
  AGENT_PLATFORM_MODEL_GATEWAY_REVOCATION_FILE: /app/model-gateway-controls/revocations.txt
  AGENT_PLATFORM_WORKLOAD_IDENTITY_MODE: kubernetes_hybrid
  AGENT_PLATFORM_WORKLOAD_IDENTITY_ISSUER: kubernetes
  AGENT_PLATFORM_WORKLOAD_IDENTITY_AUDIENCE: mandate-api
  AGENT_PLATFORM_WORKLOAD_IDENTITY_REQUIRED_SCOPES: worker_service
  AGENT_PLATFORM_WORKLOAD_IDENTITY_ALLOWED_SUBJECTS_JSON: '{"worker_service":["opencode.apply_executor","opencode.proposer"]}'
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_EVIDENCE: deployment_attestation
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_EGRESS_JAIL: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_NO_AMBIENT_CREDENTIALS: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_MODEL_GATEWAY: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_COST_CUTOFF: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_CONSEQUENCE_ENFORCEMENT: "true"
  AGENT_PLATFORM_HOSTED_HARNESS_SAFE_FLOOR_AUDIT: "true"

skills:
  enabled: true
  configMapName: mandate-skill-packs
  mountPath: /var/lib/mandate/skills

migrations:
  enabled: true
  useHelmHooks: false
  useArgoHooks: true
  disableStartupSchemaMigration: true

localWorker:
  health:
    startup:
      timeoutSeconds: 15
    liveness:
      timeoutSeconds: 15
  resources:
    limits:
      memory: 512Mi
  enabled: true
  replicaCount: 1
  capabilities: task.echo,approval.probe,readonly_sql,audit.digest,mandate.ops.inspect,mandate.deploy.smoke
  pollSeconds: 2
  batchSize: 1
  # CES-601: the local worker is a credential-free model-gateway client, so its
  # model_gateway provider fingerprints differently from the API process. Pin
  # its true (no-auth) digests here instead of inheriting the shared auth-bearing
  # top-level pin (which crash-loops it fail-closed).
  env:
    AGENT_PLATFORM_PROVIDER_DIGEST_PINS_JSON: '{"model_gateway":{"digest":"sha256:72f9d4f2bb0220793aa81929272cfd8e93b45e55a97e59c371908b1bd393ead1","protocol":"model_gateway"},"readonly-sql-broker":{"digest":"sha256:73203a3ff8309cb762966f7559abf871f46a239c3136e7a5658eb069f52066c1","protocol":"readonly_sql"}}'

callbackAdapter:
  health:
    startup:
      timeoutSeconds: 15
    liveness:
      timeoutSeconds: 15
  resources:
    limits:
      memory: 512Mi
  enabled: true
  replicaCount: 1
  sink: http
  secretKeys:
    - AGENT_PLATFORM_OPENCLAW_CALLBACK_URL
    - AGENT_PLATFORM_OPENCLAW_CALLBACK_TOKEN
  pollSeconds: 2
  batchSize: 10
  leaseSeconds: 60
  discordThreads:
    enabled: true
    autoArchiveMinutes: 1440

gitDeliverer:
  health:
    startup:
      timeoutSeconds: 15
    liveness:
      timeoutSeconds: 15
  resources:
    limits:
      memory: 512Mi
  enabled: true
  replicaCount: 1
  secretKeys:
    - AGENT_PLATFORM_GIT_DELIVERY_GITHUB_TOKEN
  pollSeconds: 5
  batchSize: 10
  claimStaleSeconds: 300
  targetRepo: cesaregarza/mandate-sandbox
  remoteUrl: https://github.com/cesaregarza/mandate-sandbox
  baseRef: main
  allowedBaseRepos:
    - https://github.com/cesaregarza/mandate-sandbox

modelGateway:
  enabled: true
  replicaCount: 1
  env:
    AGENT_PLATFORM_PROVIDER_DIGEST_PINS_JSON: '{"model_gateway":{"digest":"sha256:2010eb78000580e9bc9ad74b57b70500318014a397193133005fae153b39c336","protocol":"model_gateway"}}'
  codexAuthPersistence:
    enabled: true
    accessModes:
      - ReadWriteOnce
    storageClassName: do-block-storage
    size: 1Gi

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  annotations:
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - agent-control-plane.garz.ai
  tls:
    enabled: true
    secretName: agent-control-plane-tls
    certificate:
      enabled: true
      issuerName: letsencrypt-prod
      dnsNames: []

networkPolicy:
  enabled: true
  ingress:
    sources:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
        podSelector:
          matchLabels:
            app.kubernetes.io/name: ingress-nginx
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: agent-workloads
        podSelector:
          matchLabels:
            app.kubernetes.io/name: agent-workloads
            app.kubernetes.io/instance: agent-workloads
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: agent-workloads
        podSelector:
          matchLabels:
            app.kubernetes.io/name: opencode-proposer
            app.kubernetes.io/instance: agent-workloads
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: agent-workloads
        podSelector:
          matchLabels:
            app.kubernetes.io/name: opencode-apply-executor
            app.kubernetes.io/instance: agent-workloads
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: splattop
            app.kubernetes.io/instance: splattop-prod
            app.kubernetes.io/component: prometheus
    ports:
      - port: 8000
        protocol: TCP
      - port: 9090
        protocol: TCP
  egress:
    dns:
      enabled: true
      destinations:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    destinations:
      - ipBlock:
          cidr: 10.108.0.0/20
        ports:
          - port: 25060
            protocol: TCP
      - ipBlock:
          cidr: 0.0.0.0/0
        ports:
          - port: 443
            protocol: TCP

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

extraVolumes:
  - name: registry-overlay
    configMap:
      name: agent-control-plane-registry-overlay
  - name: model-gateway-controls
    configMap:
      name: agent-control-plane-model-gateway-controls

extraVolumeMounts:
  - name: registry-overlay
    mountPath: /app/registries/workload_imports.yaml
    subPath: workload_imports.yaml
    readOnly: true
  - name: registry-overlay
    mountPath: /app/registries/policy.prod.yaml
    subPath: policy.prod.yaml
    readOnly: true
  - name: registry-overlay
    mountPath: /app/registries/evals.yaml
    subPath: evals.yaml
    readOnly: true
  - name: registry-overlay
    mountPath: /app/registries/imports
    readOnly: true
  - name: model-gateway-controls
    mountPath: /app/model-gateway-controls
    readOnly: true

postgresSweep:
  # CES-608: production owns this as a raw runtime-control CronJob so it can
  # set startingDeadlineSeconds and a one-connection pool ceiling. Keep the
  # reusable chart CronJob disabled to prevent duplicate sweeps.
  enabled: false

syntheticLiveVerify:
  enabled: true
  schedule: "*/5 * * * *"
  # Journeys run sequentially: 120s + 210s polling, 60s of bounded
  # control/evidence calls per journey, and 30s of Job startup headroom.
  # At 480s the chart's Forbid policy skips at most the next five-minute tick.
  activeDeadlineSeconds: 480
  # Make the HTTP bound explicit so the deadline budget cannot drift from the
  # pinned verifier's current default without this values contract changing.
  args:
    - --http-timeout-seconds
    - "15"
  # The Control SDK requires verified TLS outside explicit loopback probes.
  baseUrl: https://agent-control-plane.garz.ai
  principal:
    issuer: synthetic
    subject_id: mandate-live-probe
    subject_kind: service
    tenant_id: garzai-prod
    roles:
      - synthetic_probe
    provenance:
      source: synthetic-live-verify
      identifiers:
        tenant_ref: garzai-prod
        subject_ref: mandate-live-probe
  deliveryTarget:
    kind: internal
    target_ref: synthetic-live-verify
    message_ref: scheduled-synthetic-live-verify
  surfaceContext:
    source: synthetic-live-verify
    surface_ref: synthetic-live-verify
    adapter_provenance:
      source: synthetic-live-verify
      identifiers:
        probe: scheduled
  trustedContext:
    entitlements: []
    attachment_authorities: []
  journeys:
    - id: deployment-smoke
      capability_id: mandate.deploy.smoke
      text: Run the deployment smoke probe and return the deployment marker.
      max_cost_usd: 0.05
      max_runtime_seconds: 60
      timeout_seconds: 120
      poll_seconds: 5
      expected_status: succeeded
      required_result_fields:
        - output_text
        - schema_version
      required_callback_types:
        - job.accepted
        - job.progress
        - job.succeeded
      required_event_types:
        - run.created
        - policy.evaluated
        - result.released
    - id: readonly-query-skill-digests
      capability_id: agent_workloads.readonly_query
      text: Show 3 recent X Power schedule windows from xscraper.schedules.
      max_cost_usd: 1.0
      max_runtime_seconds: 180
      # Keep queueing and result-settlement time outside the requested runtime.
      timeout_seconds: 210
      poll_seconds: 5
      expected_status: succeeded
      expected_withheld_labels:
        - attempt_count
        - broker
        - broker_call
        - columns
        - passes
        - preset
        - profile
        - query_digest
        - readonly_query_context_attribution
        - recovered_retry_count
        - rows
      required_result_fields:
        - output_text
      required_callback_types:
        - job.accepted
        - job.progress
        - job.succeeded
      required_event_types:
        - run.created
        - policy.evaluated
        - model_call.finished
        - tool.started
        - result.released
      required_skill_ids:
        - xscraper-schema
        - xscraper-glossary
