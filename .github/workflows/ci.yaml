name: Config Repo CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # Run on merge-queue batches so the required check reports on merge_group
  # events — required for GitHub merge queue (replaces the strict
  # "up to date before merging" rebase requirement).
  merge_group:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Helm for chart contract tests
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install dependencies
        run: uv sync

      - name: Check grant ownership map
        run: uv run python scripts/generate_grant_ownership.py --check

      - name: Run Python contract tests
        run: uv run python -m unittest discover -s tests

      - name: Check control-plane release pin
        run: uv run python scripts/check_control_plane_release_pin.py

  agent-workloads-identity-digest-drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check agent-workloads identity digest drift
        uses: cesaregarza/.github/actions/agent-workloads-identity-digest-drift-gate@a1d2fb4a6b288066574b1ac53074ac62e920a07f

  agent-control-plane-deployed-registry-compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployed registry compatibility
        uses: cesaregarza/.github/actions/agent-control-plane-registry-compat-gate@a1d2fb4a6b288066574b1ac53074ac62e920a07f

  agent-control-plane-provider-digest-pins:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Read pinned agent-platform revision
        id: target
        run: |
          set -euo pipefail
          revision="$(uv run python scripts/check_agent_control_plane_provider_pins.py --print-target-revision)"
          [[ -n "$revision" ]] || { echo "::error::target revision is empty" >&2; exit 1; }
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"

      - name: Fetch source and registry credentials
        id: broker
        uses: cesaregarza/.github/actions/fetch-broker-credentials@a1d2fb4a6b288066574b1ac53074ac62e920a07f
        with:
          broker-url: https://credentials.garz.ai
          audience: https://credentials.garz.ai/v1
          capabilities: '["mandate-contracts-read","digitalocean-registry-read"]'

      - name: Check out pinned agent-platform source
        uses: actions/checkout@v4
        with:
          repository: cesaregarza/agent-platform
          ref: ${{ steps.target.outputs.revision }}
          path: agent-platform
          token: ${{ fromJson(steps.broker.outputs.secrets-json).MANDATE_CONTRACTS_READ_TOKEN }}
          fetch-depth: 0

      - name: Ensure agent-platform main ref is available
        run: git -C agent-platform fetch origin main:refs/remotes/origin/main

      - name: Install crane
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            --output /tmp/go-containerregistry.tar.gz \
            https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz
          gzip -t /tmp/go-containerregistry.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/go-containerregistry.tar.gz crane
          crane version

      - name: Authenticate to DigitalOcean Registry
        env:
          DIGITALOCEAN_REGISTRY_TOKEN: ${{ fromJson(steps.broker.outputs.secrets-json).DIGITALOCEAN_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$DIGITALOCEAN_REGISTRY_TOKEN" ]] || {
            echo "::error::DIGITALOCEAN_REGISTRY_TOKEN is required to query image manifests" >&2
            exit 1
          }
          echo "$DIGITALOCEAN_REGISTRY_TOKEN" |
            crane auth login registry.digitalocean.com -u doctl --password-stdin

      - name: Check provider digest pins
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
        run: >
          uv run python scripts/check_agent_control_plane_provider_pins.py
          --agent-platform-repo agent-platform
          --check-image-exists

      - name: Read deployed skills bundle manifest
        id: skills
        run: |
          set -euo pipefail
          manifest="${RUNNER_TEMP}/agent-control-plane-skills-manifest.json"
          crane export registry.digitalocean.com/sendouq/agent-workloads-skills:main - |
            tar -xO skill-bundle/manifest.json > "$manifest"
          [[ -s "$manifest" ]] || {
            echo "::error::deployed skill-bundle manifest is empty" >&2
            exit 1
          }
          echo "manifest=${manifest}" >> "$GITHUB_OUTPUT"

      - name: Check config coherence
        run: >
          uv run python scripts/check_agent_control_plane_config_coherence.py
          --agent-platform-repo agent-platform
          --skills-manifest "${{ steps.skills.outputs.manifest }}"
          --skills-manifest-source
          "registry.digitalocean.com/sendouq/agent-workloads-skills:main:/skill-bundle/manifest.json"

  agent-control-plane-registry-overlay-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync

      - name: Install kustomize
        env:
          KUSTOMIZE_VERSION: v5.4.3
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            --output kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          gzip -t kustomize.tar.gz
          tar -xzf kustomize.tar.gz
          sudo install -m 0755 kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Check complete registry overlay Application render
        run: uv run python scripts/check_agent_control_plane_registry_overlay_render.py

  operator-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            --output kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          gzip -t kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate operator-only infrastructure manifests
        run: >-
          kubeconform
          -schema-location default
          -strict -summary -exit-on-error
          infra/ingress-nginx/citrus-source-ip-load-balancer.yaml

  helm-and-kubeconform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chart:
          - name: splattop
            path: helm/splattop
            release: splattop
            prod_values: helm/splattop/values-prod.yaml
          - name: splattop-blog
            path: helm/splattop-blog
            release: splattop-blog
            prod_values: helm/splattop-blog/values-prod.yaml
          - name: cegarza-blog
            path: helm/cegarza-blog
            release: cegarza-blog
            prod_values: helm/cegarza-blog/values-cegarza.yaml
          - name: citrus
            path: helm/citrus
            release: citrus
            prod_values: helm/citrus/values.yaml
          - name: garz-observability
            path: helm/garz-observability
            release: garz-observability
            prod_values: helm/garz-observability/values-prod.yaml
          - name: splattop-teams
            path: helm/splattop-teams
            release: splattop-teams
            prod_values: helm/splattop-teams/values-prod.yaml
          - name: skyquiet-server
            path: helm/skyquiet-server
            release: skyquiet-server
            prod_values: helm/skyquiet-server/values.yaml
          - name: spotify-hot-100
            path: helm/spotify-hot-100
            release: spotify-hot-100
            prod_values: helm/spotify-hot-100/values.yaml
          - name: poetry
            path: helm/poetry
            release: poetry
            prod_values: helm/poetry/values-ci.yaml
          - name: agent-workloads
            path: helm/agent-workloads
            release: agent-workloads
            prod_values: apps/agent-workloads/values.yaml
          - name: agent-8s
            path: apps/agent-8s
            release: agent-8s
            prod_values: apps/agent-8s/values.yaml
          - name: agent-control-plane-registry-overlay
            path: apps/agent-control-plane-registry-overlay
            release: agent-control-plane-registry-overlay
            prod_values: apps/agent-control-plane-registry-overlay/values.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install kubeconform
        run: |
          curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
            --output kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          gzip -t kubeconform.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Helm lint
        run: helm lint "${{ matrix.chart.path }}"

      - name: Render manifests (default + prod)
        if: matrix.chart.name != 'citrus'
        run: |
          mkdir -p rendered
          helm template "${{ matrix.chart.release }}" "${{ matrix.chart.path }}" > "rendered/${{ matrix.chart.name }}-default.yaml"
          helm template "${{ matrix.chart.release }}" "${{ matrix.chart.path }}" -f "${{ matrix.chart.prod_values }}" > "rendered/${{ matrix.chart.name }}-prod.yaml"

      - name: Render Citrus production, dev, payment, and safe runtime
        if: matrix.chart.name == 'citrus'
        run: >-
          python3 scripts/check_citrus_recurring_runtime_render.py
          --chart helm/citrus
          --output-dir rendered
          --helm helm
          --skip-lint

      - name: Render Citrus production, dev, and optional workloads
        if: matrix.chart.name == 'citrus'
        run: |
          set -euo pipefail
          mkdir -p rendered
          chart=helm/citrus

          # Preserve the production and base-dev safeguard matrix. The preceding
          # checker also renders the actual Argo runtime overlay separately as
          # citrus-runtime-dev.yaml for the same strict kubeconform pass.
          helm template citrus "$chart" \
            --namespace default \
            -f "$chart/values.yaml" \
            > rendered/citrus-prod.yaml
          helm template citrus-dev "$chart" \
            --namespace citrus-dev \
            -f "$chart/values.yaml" \
            -f "$chart/values-dev.yaml" \
            -f "$chart/values-payment-dev.yaml" \
            > rendered/citrus-dev.yaml

          # Prove production cannot render a different image until an operator
          # copies that exact passed-receipt SHA into the attestation field.
          promotion_candidate=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          if helm template citrus "$chart" \
            --namespace default \
            -f "$chart/values.yaml" \
            --set-string image.tag="$promotion_candidate" \
            > /dev/null 2> rendered/citrus-promotion-gate-error.txt; then
            echo "Citrus production must reject an unattested image SHA" >&2
            exit 1
          fi
          grep -F 'stripeSmokePromotion.verifiedImageTag' rendered/citrus-promotion-gate-error.txt >/dev/null
          grep -F 'must exactly match image.tag' rendered/citrus-promotion-gate-error.txt >/dev/null
          rm rendered/citrus-promotion-gate-error.txt

          # Exercise only the CES-883 dev runner against the exact immutable
          # image.tag selected by the dev overlays. This renders references but
          # never decrypts or reads Secret values, resolves DNS, or contacts Stripe.
          helm template citrus-dev "$chart" \
            --namespace citrus-dev \
            -f "$chart/values.yaml" \
            -f "$chart/values-dev.yaml" \
            -f "$chart/values-payment-dev.yaml" \
            --set stripeSmokeRunner.enabled=true \
            --set-string stripeSmokeRunner.expectedAccountId=acct_0000000000000000 \
            > rendered/citrus-stripe-smoke-enabled-dev.yaml

          # Exercise the separately gated CES-881 PostSync lifecycle with only
          # a reserved account-shaped sentinel. Rendering never contacts Stripe.
          helm template citrus-dev "$chart" \
            --namespace citrus-dev \
            -f "$chart/values.yaml" \
            -f "$chart/values-dev.yaml" \
            -f "$chart/values-payment-dev.yaml" \
            --set stripeSmokeRunner.enabled=true \
            --set stripeSmokeRunner.automation.enabled=true \
            --set-string stripeSmokeRunner.expectedAccountId=acct_0000000000000000 \
            > rendered/citrus-stripe-smoke-automated-dev.yaml

          # Exercise disabled-by-default consumers without contacting providers
          # or rendering any Secret object.
          helm template citrus "$chart" \
            --namespace default \
            -f "$chart/values.yaml" \
            --set paymentSafety.enabled=true \
            --set-string paymentSafety.environment=production \
            --set-string paymentSafety.owner=citrus \
            --set-string paymentSafety.networkMode=allow \
            --set paymentSafety.policy.required=true \
            --set-string paymentSafety.policy.provider=cilium \
            --set-string paymentSafety.policy.revision=ces-850-ci \
            --set paymentSafety.networkPolicy.enabled=true \
            --set billingWorker.enabled=true \
            --set-string billingWorker.topologyRevision=ces-850-ci \
            --set recurringRuntime.enabled=true \
            --set-string recurringRuntime.topologyRevision=ces-850-ci \
            --set recurringRuntime.preflight.enabled=true \
            --set-string recurringRuntime.preflight.topologyRevision=ces-850-ci \
            --set-string recurringRuntime.health.topologyRevision=ces-850-ci \
            > rendered/citrus-optional-workloads.yaml

          # Schema-check the isolated suspended CronJob and its dedicated egress
          # policy using an existing command-bearing image, release-bound
          # synthetic Secret name, and reserved database FQDN. This image is not
          # pinned in either environment and is not activation-compatible with
          # the pending least-privilege source/runtime contract.
          helm template citrus "$chart" \
            --namespace default \
            -f "$chart/values.yaml" \
            --show-only templates/sms-reconciliation-cronjob.yaml \
            --set-string image.tag=0e2258bf95c6170895c26780258eb42d5b5c557c \
            --set-string stripeSmokePromotion.verifiedImageTag=0e2258bf95c6170895c26780258eb42d5b5c557c \
            --set smsReconciliation.enabled=true \
            --set-string smsReconciliation.verifiedImageTag=0e2258bf95c6170895c26780258eb42d5b5c557c \
            --set-string 'smsReconciliation.commandCompatibleImageTags[0]=0e2258bf95c6170895c26780258eb42d5b5c557c' \
            --set-string smsReconciliation.secretName=citrus-sms-reconciliation-runtime \
            --set smsReconciliation.networkPolicy.enabled=true \
            --set-string smsReconciliation.networkPolicy.provider=cilium \
            --set-string smsReconciliation.networkPolicy.revision=ces-848-ci \
            --set-string smsReconciliation.networkPolicy.database.host=db.sms-reconciliation.example \
            > rendered/citrus-sms-reconciliation-prod.yaml
          helm template citrus-dev "$chart" \
            --namespace citrus-dev \
            -f "$chart/values.yaml" \
            -f "$chart/values-dev.yaml" \
            --show-only templates/sms-reconciliation-cronjob.yaml \
            --set-string image.tag=0e2258bf95c6170895c26780258eb42d5b5c557c \
            --set smsReconciliation.enabled=true \
            --set-string smsReconciliation.verifiedImageTag=0e2258bf95c6170895c26780258eb42d5b5c557c \
            --set-string 'smsReconciliation.commandCompatibleImageTags[0]=0e2258bf95c6170895c26780258eb42d5b5c557c' \
            --set-string smsReconciliation.secretName=citrus-dev-sms-reconciliation-runtime \
            --set smsReconciliation.networkPolicy.enabled=true \
            --set-string smsReconciliation.networkPolicy.provider=cilium \
            --set-string smsReconciliation.networkPolicy.revision=ces-848-ci \
            --set-string smsReconciliation.networkPolicy.database.host=db.sms-reconciliation.example \
            > rendered/citrus-sms-reconciliation-dev.yaml
          # Materialize the CES-807 scheduler only with a command-bearing image
          # receipt, the isolated payment projection, and the Cilium boundary.
          # Keep it suspended while also exercising the CES-850 workloads.
          helm template citrus "$chart" \
            --namespace default \
            -f "$chart/values.yaml" \
            -f "$chart/values-payment-prod.yaml" \
            --set-string image.tag=4353f11595094bc4893b5799233cfd56c52aed89 \
            --set billingWorker.enabled=true \
            --set-string billingWorker.topologyRevision=ces-850-ci \
            --set recurringRuntime.enabled=true \
            --set-string recurringRuntime.expectedSourceRevision=4353f11595094bc4893b5799233cfd56c52aed89 \
            --set-string recurringRuntime.topologyRevision=ces-850-ci \
            --set recurringRuntime.preflight.enabled=true \
            --set-string recurringRuntime.preflight.topologyRevision=ces-850-ci \
            --set-string recurringRuntime.health.topologyRevision=ces-850-ci \
            --set-string stripeSmokePromotion.verifiedImageTag=4353f11595094bc4893b5799233cfd56c52aed89 \
            --set directOrderPaymentSweep.enabled=true \
            --set-string directOrderPaymentSweep.runtimeSecretName=citrus-ci-direct-order-runtime \
            --set-string directOrderPaymentSweep.verifiedImageTag=4353f11595094bc4893b5799233cfd56c52aed89 \
            --set paymentSafety.enabled=true \
            --set-string paymentSafety.environment=production \
            --set-string paymentSafety.owner=citrus \
            --set-string paymentSafety.networkMode=allow \
            --set paymentSafety.policy.required=true \
            --set-string paymentSafety.policy.provider=cilium \
            --set-string paymentSafety.policy.revision=ces-807-ci \
            --set paymentSafety.networkPolicy.enabled=true \
            > rendered/citrus-schedulers.yaml

          # Preserve independent dev/prod payment-projection render coverage.
          # These files contain Secret refs, never decrypted values or credentials.
          helm template citrus "$chart" \
            --namespace default \
            -f "$chart/values.yaml" \
            -f "$chart/values-payment-prod.yaml" \
            > rendered/citrus-payment-prod.yaml
          helm template citrus-dev "$chart" \
            --namespace citrus-dev \
            -f "$chart/values.yaml" \
            -f "$chart/values-dev.yaml" \
            -f "$chart/values-payment-dev.yaml" \
            > rendered/citrus-payment-dev.yaml

          # Exercise the active CES-845 contract with optional workloads and
          # synthetic destinations. Rendering an FQDN never resolves or contacts it.
          helm template citrus-dev "$chart" \
            --namespace citrus-dev \
            -f "$chart/values.yaml" \
            -f "$chart/values-dev.yaml" \
            --set paymentSafety.enabled=true \
            --set-string paymentSafety.environment=development \
            --set-string paymentSafety.owner=citrus-dev \
            --set-string paymentSafety.networkMode=deny \
            --set paymentSafety.policy.required=true \
            --set-string paymentSafety.policy.provider=cilium \
            --set-string paymentSafety.policy.revision=ces-845-ci \
            --set paymentSafety.networkPolicy.enabled=true \
            --set-string paymentSafety.networkPolicy.database.host=db.dev.example \
            --set billingWorker.enabled=true \
            --set-string billingWorker.topologyRevision=ces-850-ci \
            --set recurringRuntime.enabled=true \
            --set-string recurringRuntime.topologyRevision=ces-850-ci \
            --set recurringRuntime.preflight.enabled=true \
            --set-string recurringRuntime.preflight.topologyRevision=ces-850-ci \
            --set-string recurringRuntime.health.topologyRevision=ces-850-ci \
            > rendered/citrus-payment-safety-dev.yaml
          helm template citrus "$chart" \
            --namespace default \
            -f "$chart/values.yaml" \
            --set paymentSafety.enabled=true \
            --set-string paymentSafety.environment=production \
            --set-string paymentSafety.owner=citrus \
            --set-string paymentSafety.networkMode=allow \
            --set paymentSafety.policy.required=true \
            --set-string paymentSafety.policy.provider=cilium \
            --set-string paymentSafety.policy.revision=ces-845-ci \
            --set paymentSafety.networkPolicy.enabled=true \
            --set billingWorker.enabled=true \
            --set-string billingWorker.topologyRevision=ces-850-ci \
            --set recurringRuntime.enabled=true \
            --set-string recurringRuntime.topologyRevision=ces-850-ci \
            --set recurringRuntime.preflight.enabled=true \
            --set-string recurringRuntime.preflight.topologyRevision=ces-850-ci \
            --set-string recurringRuntime.health.topologyRevision=ces-850-ci \
            > rendered/citrus-payment-safety-prod.yaml

          # Exercise CES-829 with synthetic references only. No Secret values,
          # DNS lookup, Cloudflare request, or live activation occurs here.
          cloudflare_sha=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template citrus-ci-cloudflare-access "$chart" \
            --namespace default \
            -f "$chart/values.yaml" \
            --set cloudflareAccess.enabled=true \
            --set-string cloudflareAccess.owner=citrus \
            --set-string cloudflareAccess.secretName=citrus-cloudflare-access \
            --set-string cloudflareAccess.rolloutRevision=ces-829-ci \
            --set-string cloudflareAccess.verifiedImageTag="$cloudflare_sha" \
            --set-string image.tag="$cloudflare_sha" \
            --set-string stripeSmokePromotion.verifiedImageTag="$cloudflare_sha" \
            > rendered/citrus-cloudflare-access.yaml

      - name: Verify Citrus workload render coverage
        if: matrix.chart.name == 'citrus'
        run: |
          set -euo pipefail

          grep -E '^[[:space:]]+app.kubernetes.io/instance: citrus$' rendered/citrus-prod.yaml >/dev/null
          grep -E '^[[:space:]]+app.kubernetes.io/instance: citrus-dev$' rendered/citrus-dev.yaml >/dev/null
          grep -F 'ALLOWED_HOSTS: "citrus-grace.com,www.citrus-grace.com"' rendered/citrus-prod.yaml >/dev/null
          grep -F 'SITE_NAME: "Citrus Grace Dev"' rendered/citrus-dev.yaml >/dev/null
          grep -F '    - host: dev.citrus-grace.com' rendered/citrus-dev.yaml >/dev/null
          grep -F 'citrus.grace/payment-rollout-revision: "ces-844-test-mode-v2"' rendered/citrus-dev.yaml >/dev/null
          # Web, migration, media worker, both media CronJobs, and the suspended
          # payment sweep each receive the same two-key test-mode Secret plus
          # the exact dev webhook field.
          test "$(grep -Fc 'name: citrus-dev-payment-credentials' rendered/citrus-dev.yaml)" -eq 12
          test "$(grep -Fc 'key: STRIPE_WEBHOOK_SECRET_DEV' rendered/citrus-dev.yaml)" -eq 6
          test "$(grep -Fc 'name: STRIPE_WEBHOOK_SECRET_OWNER' rendered/citrus-dev.yaml)" -eq 6
          if grep -F 'STRIPE_WEBHOOK_SECRET_PROD' rendered/citrus-dev.yaml >/dev/null; then
            echo "Citrus dev must never project the production webhook field" >&2
            exit 1
          fi
          grep -F 'app.kubernetes.io/component: migrations' rendered/citrus-prod.yaml >/dev/null
          grep -F 'app: citrus-web' rendered/citrus-prod.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: media-worker' rendered/citrus-prod.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: media-requeue' rendered/citrus-prod.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: media-gc' rendered/citrus-prod.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: billing-worker' rendered/citrus-optional-workloads.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: recurring-preflight' rendered/citrus-optional-workloads.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: recurring-tick' rendered/citrus-optional-workloads.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: recurring-health' rendered/citrus-optional-workloads.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: sms-reconciliation' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          grep -F 'app.kubernetes.io/component: sms-reconciliation' rendered/citrus-sms-reconciliation-dev.yaml >/dev/null
          grep -F '  suspend: true' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          grep -F '  suspend: true' rendered/citrus-sms-reconciliation-dev.yaml >/dev/null
          grep -F '    - name: TWILIO_SMS_ENABLED' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          grep -F '      value: "False"' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          grep -F '    - sweep_manual_order_sms_attempts' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          grep -F '    - --stale-minutes' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          grep -F '    - --limit' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          grep -F 'citrus-sms-reconciliation-runtime' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          grep -F 'citrus-dev-sms-reconciliation-runtime' rendered/citrus-sms-reconciliation-dev.yaml >/dev/null
          grep -F 'secretKeyRef:' rendered/citrus-sms-reconciliation-prod.yaml >/dev/null
          for file in rendered/citrus-sms-reconciliation-*.yaml; do
            grep -F 'kind: CiliumNetworkPolicy' "$file" >/dev/null
            grep -F 'argocd.argoproj.io/sync-wave: "2"' "$file" >/dev/null
            grep -F 'citrus.grace/sms-reconciliation-egress: restricted' "$file" >/dev/null
            grep -F 'citrus.grace/sms-reconciliation-egress-policy-revision: "ces-848-ci"' "$file" >/dev/null
            test "$(grep -Fc 'matchName: "db.sms-reconciliation.example"' "$file")" -eq 2
            if grep -Ei 'matchPattern:|toEntities:|matchName:.*(stripe|twilio)' "$file" >/dev/null; then
              echo "Citrus SMS reconciliation egress must remain DNS-plus-exact-DB only" >&2
              exit 1
            fi
          done

          for file in rendered/citrus-sms-reconciliation-*.yaml; do
            if grep -F 'secretRef:' "$file" >/dev/null; then
              echo "Citrus SMS reconciliation must not import a Secret with envFrom" >&2
              exit 1
            fi
            if grep -E '(django-secrets|django-email-secrets|django-spaces-secrets|citrus-dev-app-key|payment-credentials|STRIPE_|TWILIO_(ACCOUNT|API|AUTH|MESSAGING))' "$file" >/dev/null; then
              echo "Citrus SMS reconciliation rendered a broad or provider Secret reference" >&2
              exit 1
            fi
            if [[ "$(grep -c 'secretKeyRef:' "$file")" -ne 6 ]]; then
              echo "Citrus SMS reconciliation must project exactly six named runtime keys" >&2
              exit 1
            fi
          done

          if grep -F 'app.kubernetes.io/component: sms-reconciliation' \
            rendered/citrus-prod.yaml rendered/citrus-dev.yaml >/dev/null; then
            echo "Actual Citrus environment renders must keep SMS reconciliation disabled" >&2
            exit 1
          fi
          schedulers=rendered/citrus-schedulers.yaml
          grep -F 'app.kubernetes.io/component: billing-worker' "$schedulers" >/dev/null
          grep -F 'app.kubernetes.io/component: recurring-preflight' "$schedulers" >/dev/null
          grep -F 'app.kubernetes.io/component: recurring-tick' "$schedulers" >/dev/null
          grep -F 'app.kubernetes.io/component: recurring-health' "$schedulers" >/dev/null
          grep -F 'app.kubernetes.io/component: direct-order-payment-sweep' "$schedulers" >/dev/null
          grep -F '  suspend: true' "$schedulers" >/dev/null
          grep -F 'citrus.grace/verified-image-tag: "4353f11595094bc4893b5799233cfd56c52aed89"' "$schedulers" >/dev/null
          grep -F 'name: citrus-ci-direct-order-runtime' "$schedulers" >/dev/null

          if grep -E '^kind:[[:space:]]+CiliumNetworkPolicy$|PAYMENT_NETWORK_MODE|payment-egress-boundary' \
            rendered/citrus-prod.yaml >/dev/null; then
            echo "Citrus production Argo render must keep CES-845 disabled" >&2
            exit 1
          fi

          active_dev=rendered/citrus-dev.yaml
          mapfile -t active_dev_images < <(
            grep -Eo 'registry\.digitalocean\.com/sendouq/citrus:[^"[:space:]]+' "$active_dev" |
              sort -u
          )
          if [[ ${#active_dev_images[@]} -ne 1 ]]; then
            echo "Citrus dev render must use exactly one unique Citrus image" >&2
            exit 1
          fi
          active_dev_sha=${active_dev_images[0]##*:}
          [[ "$active_dev_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$(grep -Ec '^kind:[[:space:]]+CiliumNetworkPolicy$' "$active_dev")" -eq 2
          test "$(grep -Fc 'citrus.grace/payment-egress-boundary: enabled' "$active_dev")" -eq 6
          test "$(grep -Fc 'name: PAYMENT_EGRESS_POLICY_REVISION' "$active_dev")" -eq 6
          test "$(grep -Fc 'value: "ces-845-dev-v1"' "$active_dev")" -eq 6
          test "$(grep -Fc 'citrus.grace/payment-egress-policy-revision: "ces-845-dev-v1"' "$active_dev")" -eq 4
          test "$(grep -Fc 'matchName:' "$active_dev")" -eq 8
          test "$(grep -Fc 'port: "25060"' "$active_dev")" -eq 2
          grep -F 'app.kubernetes.io/component: direct-order-payment-sweep' "$active_dev" >/dev/null
          grep -F '  suspend: false' "$active_dev" >/dev/null
          grep -F "citrus.grace/verified-image-tag: \"$active_dev_sha\"" "$active_dev" >/dev/null
          grep -F 'name: citrus-dev-sweep-runtime' "$active_dev" >/dev/null
          grep -F 'value: "development"' "$active_dev" >/dev/null
          grep -F 'value: "deny"' "$active_dev" >/dev/null
          grep -F 'value: "cilium"' "$active_dev" >/dev/null
          if grep -Ei 'matchName:.*stripe\.(com|network)|toEntities:' "$active_dev" >/dev/null; then
            echo "Citrus dev Argo render must activate CES-845 deny mode without Stripe or broad egress" >&2
            exit 1
          fi

          stripe_smoke=rendered/citrus-stripe-smoke-enabled-dev.yaml
          grep -F 'name: citrus-dev-stripe-smoke-runner' "$stripe_smoke" >/dev/null
          grep -F 'name: citrus-dev-stripe-smoke-runner-egress' "$stripe_smoke" >/dev/null
          grep -F 'app.kubernetes.io/component: stripe-smoke-runner' "$stripe_smoke" >/dev/null
          mapfile -t stripe_smoke_images < <(
            grep -Eo 'registry\.digitalocean\.com/sendouq/citrus:[^"[:space:]]+' "$stripe_smoke" |
              sort -u
          )
          test "${#stripe_smoke_images[@]}" -eq 1
          stripe_smoke_sha=${stripe_smoke_images[0]##*:}
          [[ "$stripe_smoke_sha" =~ ^[0-9a-f]{40}$ ]]
          grep -F "citrus.grace/verified-image-tag: \"$stripe_smoke_sha\"" "$stripe_smoke" >/dev/null
          grep -F '  suspend: true' "$stripe_smoke" >/dev/null
          grep -F '      backoffLimit: 0' "$stripe_smoke" >/dev/null
          grep -F '          automountServiceAccountToken: false' "$stripe_smoke" >/dev/null
          grep -F '          restartPolicy: Never' "$stripe_smoke" >/dev/null
          grep -F '                - run_stripe_smoke' "$stripe_smoke" >/dev/null
          test "$(grep -Fc 'name: CITRUS_STRIPE_SMOKE_RUNNER' "$stripe_smoke")" -eq 1
          test "$(grep -Fc 'name: CITRUS_STRIPE_SMOKE_EXPECTED_ACCOUNT_ID' "$stripe_smoke")" -eq 1
          test "$(grep -Fc 'value: "acct_0000000000000000"' "$stripe_smoke")" -eq 1
          test "$(grep -Fc 'value: "ces-883-stripe-smoke-v1"' "$stripe_smoke")" -eq 1
          test "$(grep -Fc 'matchName: "api.stripe.com"' "$stripe_smoke")" -eq 1
          test "$(grep -Fc 'port: "25060"' "$stripe_smoke")" -eq 3
          test "$(grep -Ec '^kind:[[:space:]]+CiliumNetworkPolicy$' "$stripe_smoke")" -eq 3
          if grep -F 'serviceAccountName:' "$stripe_smoke" >/dev/null; then
            echo "The CES-883 stage-1 runner must not add a ServiceAccount" >&2
            exit 1
          fi

          stripe_smoke_auto=rendered/citrus-stripe-smoke-automated-dev.yaml
          mapfile -t stripe_smoke_auto_images < <(
            grep -Eo 'registry\.digitalocean\.com/sendouq/citrus:[^"[:space:]]+' "$stripe_smoke_auto" |
              sort -u
          )
          test "${#stripe_smoke_auto_images[@]}" -eq 1
          stripe_smoke_auto_sha=${stripe_smoke_auto_images[0]##*:}
          [[ "$stripe_smoke_auto_sha" =~ ^[0-9a-f]{40}$ ]]
          grep -F "name: citrus-smoke-$stripe_smoke_auto_sha" "$stripe_smoke_auto" >/dev/null
          grep -F 'argocd.argoproj.io/hook: PostSync' "$stripe_smoke_auto" >/dev/null
          grep -F 'argocd.argoproj.io/hook-delete-policy: HookSucceeded' "$stripe_smoke_auto" >/dev/null
          grep -F 'serviceAccountName: citrus-dev-stripe-smoke-runner' "$stripe_smoke_auto" >/dev/null
          grep -F 'automountServiceAccountToken: true' "$stripe_smoke_auto" >/dev/null
          test "$(grep -Fc 'resourceNames: ["citrus-dev-stripe-smoke-receipts"]' "$stripe_smoke_auto")" -eq 1
          test "$(grep -Fc 'value: "citrus-dev-stripe-smoke-receipts"' "$stripe_smoke_auto")" -eq 1
          grep -F "citrus.grace/source-revision: \"$stripe_smoke_auto_sha\"" "$stripe_smoke_auto" >/dev/null
          grep -F 'citrus.grace/smoke-step: "claim"' "$stripe_smoke_auto" >/dev/null
          grep -F 'value: "ces-881-stripe-smoke-gate-v1"' "$stripe_smoke_auto" >/dev/null
          grep -F 'toEntities:' "$stripe_smoke_auto" >/dev/null
          grep -F -- '- kube-apiserver' "$stripe_smoke_auto" >/dev/null
          test "$(grep -Fc 'matchName: "api.stripe.com"' "$stripe_smoke_auto")" -eq 1
          test "$(grep -Ec '^kind:[[:space:]]+(ServiceAccount|Role|RoleBinding)$' "$stripe_smoke_auto")" -eq 3
          if grep -F 'ttlSecondsAfterFinished:' "$stripe_smoke_auto" >/dev/null; then
            echo "Failed smoke hooks must remain available for diagnosis" >&2
            exit 1
          fi

          for file in rendered/citrus-*.yaml; do
            if [[ "$file" == "$stripe_smoke" || "$file" == "$stripe_smoke_auto" ]]; then
              continue
            fi
            if grep -Ei 'matchName:.*stripe\.(com|network)|CITRUS_STRIPE_SMOKE_' "$file" >/dev/null; then
              echo "Only the enabled dev runner render may contain Stripe egress or the smoke marker: $file" >&2
              exit 1
            fi
          done

          safety_dev=rendered/citrus-payment-safety-dev.yaml
          safety_prod=rendered/citrus-payment-safety-prod.yaml
          grep -F 'kind: CiliumNetworkPolicy' "$safety_dev" >/dev/null
          grep -F 'citrus.grace/payment-egress-boundary: enabled' "$safety_dev" >/dev/null
          grep -F 'matchName: "db.dev.example"' "$safety_dev" >/dev/null
          grep -F 'matchName: "citrus-media-dev.nyc3.digitaloceanspaces.com"' "$safety_dev" >/dev/null
          grep -F 'citrus.grace/payment-egress-policy-revision: "ces-845-ci"' "$safety_dev" >/dev/null
          grep -F 'value: "deny"' "$safety_dev" >/dev/null
          test "$(grep -Fc 'name: PAYMENT_EGRESS_POLICY_REVISION' "$safety_dev")" -eq 10
          if grep -Ei 'matchName:.*stripe\.(com|network)' "$safety_dev" >/dev/null; then
            echo "Development payment egress render must omit every Stripe destination" >&2
            exit 1
          fi

          grep -F 'kind: CiliumNetworkPolicy' "$safety_prod" >/dev/null
          grep -F -- '- all' "$safety_prod" >/dev/null
          grep -F 'value: "allow"' "$safety_prod" >/dev/null

          cloudflare=rendered/citrus-cloudflare-access.yaml
          grep -F 'citrus.grace/cloudflare-access-rollout-revision: "ces-829-ci"' "$cloudflare" >/dev/null
          test "$(grep -Fc 'name: CLOUDFLARE_ACCESS_REQUIRED' "$cloudflare")" -eq 1
          test "$(grep -Fc 'name: citrus-cloudflare-access' "$cloudflare")" -eq 3
          test "$(grep -Fc 'optional: false' "$cloudflare")" -ge 3

          if grep -E '^kind:[[:space:]]+Secret$' rendered/citrus-*.yaml >/dev/null; then
            echo "Citrus CI renders must never contain Secret objects" >&2
            exit 1
          fi

      - name: Verify cegarza.com chart safety semantics
        if: matrix.chart.name == 'cegarza-blog'
        run: |
          set -euo pipefail
          chart=helm/cegarza-blog
          default_render=rendered/cegarza-blog-default.yaml
          prod_render=rendered/cegarza-blog-prod.yaml

          if grep -F '  strategy:' "$default_render" >/dev/null; then
            echo "Ephemeral media must retain the default Deployment strategy" >&2
            exit 1
          fi
          assert_pod_tokens_disabled() {
            file=$1
            awk '
              function finish_document() {
                if (kind == "Deployment" || kind == "Job") {
                  workload_count++
                  if (automount_count != 1 || automount_value != "false") {
                    printf "%s: %s/%s PodSpec must set exactly one automountServiceAccountToken: false\n", FILENAME, kind, name > "/dev/stderr"
                    failed = 1
                  }
                }
                kind = ""
                name = ""
                root_spec = 0
                pod_template = 0
                pod_spec = 0
                automount_count = 0
                automount_value = ""
              }
              /^---[[:space:]]*$/ {
                finish_document()
                next
              }
              /^kind:[[:space:]]*/ {
                kind = $0
                sub(/^kind:[[:space:]]*/, "", kind)
                next
              }
              /^  name:[[:space:]]*/ && name == "" {
                name = $0
                sub(/^  name:[[:space:]]*/, "", name)
                next
              }
              /^spec:[[:space:]]*$/ {
                root_spec = 1
                next
              }
              root_spec && /^  template:[[:space:]]*$/ {
                pod_template = 1
                next
              }
              pod_template && /^    spec:[[:space:]]*$/ {
                pod_spec = 1
                next
              }
              pod_spec && /^      automountServiceAccountToken:[[:space:]]*/ {
                automount_count++
                automount_value = $0
                sub(/^      automountServiceAccountToken:[[:space:]]*/, "", automount_value)
                sub(/[[:space:]]+$/, "", automount_value)
              }
              END {
                finish_document()
                if (workload_count == 0) {
                  printf "%s: no Deployment or Job documents found\n", FILENAME > "/dev/stderr"
                  failed = 1
                }
                exit failed
              }
            ' "$file"
          }
          assert_pod_tokens_disabled "$default_render"
          assert_pod_tokens_disabled "$prod_render"
          grep -F '    type: Recreate' "$prod_render" >/dev/null
          grep -F '    rollingUpdate: null' "$prod_render" >/dev/null
          grep -F 'argocd.argoproj.io/sync-options: Prune=false,Delete=false' \
            "$prod_render" >/dev/null
          grep -F 'helm.sh/resource-policy: keep' "$prod_render" >/dev/null

          certificate_count=$(grep -c '^kind: Certificate$' "$prod_render" || true)
          test "$certificate_count" -eq 1
          if grep -E 'cert-manager.io/(cluster-issuer|issuer):' "$prod_render" >/dev/null; then
            echo "Explicit Certificate and ingress-shim must not share TLS secret ownership" >&2
            exit 1
          fi

          helm template cegarza-blog "$chart" \
            -f helm/cegarza-blog/values-cegarza.yaml \
            --set ingress.tls.certificate.enabled=false \
            --show-only templates/ingress.yaml \
            > rendered/cegarza-blog-ingress-shim.yaml
          grep -F 'cert-manager.io/cluster-issuer: letsencrypt-prod' \
            rendered/cegarza-blog-ingress-shim.yaml >/dev/null

          helm template cegarza-blog "$chart" \
            --set blog.persistence.enabled=true \
            --set blog.strategy.type=Recreate \
            --set blog.strategy.rollingUpdate.maxSurge=1 \
            --show-only templates/deployment.yaml \
            > rendered/cegarza-blog-explicit-recreate.yaml
          grep -F '    rollingUpdate: null' \
            rendered/cegarza-blog-explicit-recreate.yaml >/dev/null
          if grep -F 'maxSurge:' \
            rendered/cegarza-blog-explicit-recreate.yaml >/dev/null; then
            echo "Recreate must clear rollingUpdate settings" >&2
            exit 1
          fi

          helm template cegarza-blog "$chart" \
            -f helm/cegarza-blog/values-cegarza.yaml \
            --set blog.persistence.retainOnDelete=false \
            --show-only templates/media-pvc.yaml \
            > rendered/cegarza-blog-prunable-pvc.yaml
          if grep -E 'argocd.argoproj.io/sync-options|helm.sh/resource-policy' \
            rendered/cegarza-blog-prunable-pvc.yaml >/dev/null; then
            echo "retainOnDelete=false must remove PVC retention annotations" >&2
            exit 1
          fi

          digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm template cegarza-blog "$chart" \
            --set blog.migrations.enabled=true \
            --set-string blog.image.digest="$digest" \
            > rendered/cegarza-blog-digest.yaml
          test "$(grep -Fc "registry.digitalocean.com/sendouq/cegarza-blog@${digest}" \
            rendered/cegarza-blog-digest.yaml)" -eq 2
          grep -F -- '- /app/.venv/bin/python' \
            rendered/cegarza-blog-digest.yaml >/dev/null
          if grep -F -- '- uv' rendered/cegarza-blog-digest.yaml >/dev/null; then
            echo "The migration Job must not invoke uv or install development dependencies" >&2
            exit 1
          fi

          cegarza_render="$prod_render"
          cegarza_digest=$(awk '
            /^[[:space:]]*digest:/ {
              value = $2
              gsub(/"/, "", value)
              print value
              exit
            }
          ' helm/cegarza-blog/values-cegarza.yaml)
          cegarza_repository=$(sed -n 's/^    repository: //p' \
            helm/cegarza-blog/values-cegarza.yaml)
          cegarza_selector=$(sed -n 's/^  selectorName: //p' \
            helm/cegarza-blog/values-cegarza.yaml)
          cegarza_replace=$(sed -n 's/^  replaceOnSync: //p' \
            helm/cegarza-blog/values-cegarza.yaml)
          cegarza_settings=$(sed -n 's/^    DJANGO_SETTINGS_MODULE: //p' \
            helm/cegarza-blog/values-cegarza.yaml)
          test -n "$cegarza_digest"
          test -n "$cegarza_repository"
          test -n "$cegarza_selector"
          test -n "$cegarza_replace"
          test -n "$cegarza_settings"

          old_selector=splattop-blog
          new_selector=cegarza-blog
          old_repository=registry.digitalocean.com/sendouq/splattop-blog
          new_repository=registry.digitalocean.com/sendouq/cegarza-blog
          old_settings=splattopblog.settings
          new_settings=cegarza_site.settings
          case "${cegarza_repository}|${cegarza_settings}|${cegarza_selector}|${cegarza_replace}" in
            "${old_repository}|${old_settings}|${old_selector}|false")
              expected_replace_count=0
              expect_old_network_selector=true
              ;;
            "${new_repository}|${new_settings}|${new_selector}|true")
              expected_replace_count=1
              expect_old_network_selector=true
              ;;
            "${new_repository}|${new_settings}|${new_selector}|false")
              expected_replace_count=0
              expect_old_network_selector=false
              ;;
            *)
              echo "cegarza-blog values are not a safe rollout phase" >&2
              exit 1
              ;;
          esac

          test "$(grep -Fc "${cegarza_repository}@${cegarza_digest}" \
            "$cegarza_render")" -eq 2
          test "$(grep -Fc "app.kubernetes.io/name: ${cegarza_selector}" \
            "$cegarza_render")" -ge 1
          actual_replace_count=$(grep -Fc \
            'argocd.argoproj.io/sync-options: Force=true,Replace=true' \
            "$cegarza_render" || true)
          test "$actual_replace_count" -eq "$expected_replace_count"

          helm template cegarza-blog "$chart" \
            -f helm/cegarza-blog/values-cegarza.yaml \
            --show-only templates/cilium-network-policy.yaml \
            > rendered/cegarza-blog-network-policy.yaml
          cegarza_network_render=rendered/cegarza-blog-network-policy.yaml
          grep -F -- '- "cegarza-blog"' "$cegarza_network_render" >/dev/null
          if [[ "$expect_old_network_selector" == true ]]; then
            grep -F -- '- "splattop-blog"' "$cegarza_network_render" >/dev/null
          elif grep -F -- '- "splattop-blog"' "$cegarza_network_render" >/dev/null; then
            echo "Steady state must not retain the old endpoint label" >&2
            exit 1
          fi

          helm template cegarza-blog "$chart" \
            -f helm/cegarza-blog/values-cegarza.yaml \
            --set blog.selectorName=cegarza-blog \
            --set blog.replaceOnSync=true \
            --set-json 'networkPolicy.selectorNames=["splattop-blog","cegarza-blog"]' \
            > rendered/cegarza-blog-selector-activation.yaml
          activation_render=rendered/cegarza-blog-selector-activation.yaml
          test "$(grep -Fc 'argocd.argoproj.io/sync-options: Force=true,Replace=true' \
            "$activation_render")" -eq 1
          grep -F 'app.kubernetes.io/name: cegarza-blog' \
            "$activation_render" >/dev/null
          grep -F -- '- "splattop-blog"' "$activation_render" >/dev/null
          grep -F -- '- "cegarza-blog"' "$activation_render" >/dev/null

          helm template cegarza-blog "$chart" \
            -f helm/cegarza-blog/values-cegarza.yaml \
            --set blog.selectorName=cegarza-blog \
            --set blog.replaceOnSync=false \
            --set-json 'networkPolicy.selectorNames=["cegarza-blog"]' \
            > rendered/cegarza-blog-selector-cleanup.yaml
          cleanup_render=rendered/cegarza-blog-selector-cleanup.yaml
          if grep -F 'Force=true,Replace=true' "$cleanup_render" >/dev/null; then
            echo "The selector cleanup render must remove the replacement annotation" >&2
            exit 1
          fi
          if grep -F -- '- "splattop-blog"' "$cleanup_render" >/dev/null; then
            echo "The selector cleanup render must remove the old endpoint label" >&2
            exit 1
          fi
          grep -F 'name: cegarza-blog-secrets' "$cegarza_render" >/dev/null
          grep -F 'storageClassName: do-block-storage' "$cegarza_render" >/dev/null
          grep -F 'matchName: "private-db-postgresql-nyc3-xscraper-do-user-15543770-0.c.db.ondigitalocean.com"' \
            "$cegarza_render" >/dev/null
          grep -F 'matchPattern: "*"' "$cegarza_render" >/dev/null
          grep -F 'secretName: cegarza-dev-tls' "$cegarza_render" >/dev/null
          assert_cegarza_template_contains() {
            template=$1
            expected=$2
            helm template cegarza-blog "$chart" \
              --namespace cegarza-blog \
              -f helm/cegarza-blog/values.yaml \
              -f helm/cegarza-blog/values-cegarza.yaml \
              --show-only "$template" |
              grep -F "$expected" >/dev/null
          }
          assert_cegarza_template_contains \
            templates/cilium-network-policy.yaml \
            'argocd.argoproj.io/sync-wave: "-2"'
          assert_cegarza_template_contains \
            templates/migrations-job.yaml \
            'argocd.argoproj.io/hook: Sync'
          assert_cegarza_template_contains \
            templates/migrations-job.yaml \
            'argocd.argoproj.io/sync-wave: "-1"'
          for serving_template in \
            templates/deployment.yaml \
            templates/service.yaml \
            templates/ingress.yaml; do
            assert_cegarza_template_contains \
              "$serving_template" \
              'argocd.argoproj.io/sync-wave: "0"'
          done
          test "$(grep -Fc 'argocd.argoproj.io/sync-wave: "-2"' \
            "$cegarza_render")" -eq 1
          test "$(grep -Fc 'argocd.argoproj.io/sync-wave: "-1"' \
            "$cegarza_render")" -eq 1
          test "$(grep -Fc 'argocd.argoproj.io/sync-wave: "0"' \
            "$cegarza_render")" -eq 3
          test "$(grep -Fc 'argocd.argoproj.io/hook: Sync' \
            "$cegarza_render")" -eq 1
          grep -F 'argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded' \
            "$cegarza_render" >/dev/null
          grep -F '"helm.sh/hook": pre-install,pre-upgrade' \
            "$cegarza_render" >/dev/null
          grep -F '"helm.sh/hook-weight": "-1"' \
            "$cegarza_render" >/dev/null
          grep -F '"helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded' \
            "$cegarza_render" >/dev/null
          # Apex activated: the release now serves cegarza.com. Guard inverted from
          # the dev-phase block so the apex hostname must be present and intentional.
          if ! grep -F 'host: cegarza.com' "$cegarza_render" >/dev/null; then
            echo "Activated release must serve the apex hostname cegarza.com" >&2
            exit 1
          fi

      - name: Verify cegarza.com unsafe persistence fails closed
        if: matrix.chart.name == 'cegarza-blog'
        run: |
          set -euo pipefail
          chart=helm/cegarza-blog
          expect_failure() {
            expected=$1
            shift
            if helm template cegarza-blog "$chart" "$@" \
              >/dev/null 2>rendered/cegarza-blog-negative.err; then
              echo "Expected Helm render to fail: $expected" >&2
              exit 1
            fi
            grep -F "$expected" rendered/cegarza-blog-negative.err >/dev/null
          }
          expect_failure \
            "blog.replicas must be 1 when blog.persistence.enabled=true and blog.persistence.accessMode=ReadWriteOnce" \
            --set blog.persistence.enabled=true \
            --set blog.persistence.accessMode=ReadWriteOnce \
            --set blog.replicas=2
          expect_failure \
            "blog.strategy.type must be Recreate when blog.persistence.enabled=true" \
            --set blog.persistence.enabled=true \
            --set blog.strategy.type=RollingUpdate
          expect_failure \
            "blog.strategy.type must be Recreate when blog.persistence.enabled=true" \
            --set blog.persistence.enabled=true \
            --set blog.strategy.rollingUpdate.maxSurge=1
          expect_failure \
            "blog.image.digest must be a lowercase sha256:<64 hex> digest" \
            --set-string blog.image.digest=sha256:not-a-digest
          expect_failure \
            "networkPolicy.egress.database.host is required when networkPolicy.enabled=true" \
            --set networkPolicy.enabled=true
          expect_failure \
            "networkPolicy.egress.database.host must be an exact hostname without wildcards" \
            --set networkPolicy.enabled=true \
            --set-string networkPolicy.egress.database.host=*.example.com
          expect_failure \
            "networkPolicy.egress.database.host must be a lowercase exact DNS hostname" \
            --set networkPolicy.enabled=true \
            --set-string networkPolicy.egress.database.host=DB.EXAMPLE.COM
          expect_failure \
            "networkPolicy.egress.database.port must be between 1 and 65535" \
            --set networkPolicy.enabled=true \
            --set-string networkPolicy.egress.database.host=db.example.com \
            --set networkPolicy.egress.database.port=0

      - name: Install uv for Poetry semantic checks
        if: matrix.chart.name == 'poetry'
        uses: astral-sh/setup-uv@v5

      - name: Set up Python for Poetry semantic checks
        if: matrix.chart.name == 'poetry'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry semantic-check dependencies
        if: matrix.chart.name == 'poetry'
        run: uv sync

      - name: Run Poetry semantic checks
        if: matrix.chart.name == 'poetry'
        run: >-
          uv run python scripts/check_poetry_substrate.py
          --default-render rendered/poetry-default.yaml
          --enabled-render rendered/poetry-prod.yaml

      - name: Verify Poetry Access configuration fails closed
        if: matrix.chart.name == 'poetry'
        run: |
          set -euo pipefail
          chart=helm/poetry
          expect_failure() {
            expected=$1
            shift
            if helm template poetry "$chart" "$@" >/dev/null 2>rendered/poetry-negative.err; then
              echo "Expected Helm render to fail: $expected" >&2
              exit 1
            fi
            grep -F "$expected" rendered/poetry-negative.err >/dev/null
          }
          expect_failure "teamDomain is required" \
            --set enabled=true \
            --set application.cloudflareAccess.enabled=true \
            --set application.cloudflareAccess.teamDomain=
          expect_failure "audience is required" \
            --set enabled=true \
            --set application.cloudflareAccess.enabled=true \
            --set application.cloudflareAccess.teamDomain=https://poetry-ci.cloudflareaccess.com \
            --set application.cloudflareAccess.audience=
          expect_failure "allowedEmail is required" \
            --set enabled=true \
            --set application.cloudflareAccess.enabled=true \
            --set application.cloudflareAccess.teamDomain=https://poetry-ci.cloudflareaccess.com \
            --set application.cloudflareAccess.audience=0123456789abcdef0123456789abcdef \
            --set application.cloudflareAccess.allowedEmail=
          expect_failure "must be an https://" \
            -f helm/poetry/values-ci.yaml \
            --set application.cloudflareAccess.teamDomain=http://bad.example.com
          expect_failure "must remain cesar@cegarza.com" \
            -f helm/poetry/values-ci.yaml \
            --set application.cloudflareAccess.allowedEmail=attacker@example.com
          expect_failure "proxying requires application.cloudflareAccess.enabled=true" \
            -f helm/poetry/values-ci.yaml \
            --set-string ingress.cloudflareProxied=true \
            --set application.cloudflareAccess.enabled=false

      - name: Run kubeconform
        run: |
          set -euo pipefail
          for file in rendered/*.yaml; do
            echo "Validating ${file}"
            kubeconform \
              -schema-location default \
              -skip CiliumNetworkPolicy,Certificate \
              -strict -summary -exit-on-error "$file"
          done

      - name: Upload rendered manifests (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests-${{ matrix.chart.name }}
          path: rendered

  prometheus-rules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - name: prod
            values: helm/garz-observability/values-prod.yaml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run promtool validation
        run: >
          python scripts/validate_prometheus_config.py
          --chart-dir helm/garz-observability
          --release-name garz-observability
          --namespace monitoring
          --values ${{ matrix.env.values }}
          --label ${{ matrix.env.name }}

      - name: Reproduce the historical-query sample envelope offline
        timeout-minutes: 8
        run: python scripts/verify_prometheus_query_safety.py
