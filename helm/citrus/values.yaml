global:
  imagePullSecrets:
    - regcred

replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

image:
  repository: registry.digitalocean.com/sendouq/citrus
  tag: 3f68967f777b2665fccb4f0ab423f339b8ea1357 # allow-latest
  pullPolicy: IfNotPresent

# CES-881 production-promotion authority. The operator copies the exact SHA
# from the durable citrus-dev smoke receipt into this field in the promotion
# PR. The manual-attestation release binding prevents the release updater from
# advancing image.tag on its own while this gate is enabled.
stripeSmokePromotion:
  enabled: true
  verifiedImageTag: 3f68967f777b2665fccb4f0ab423f339b8ea1357

nameOverride: ""
fullnameOverride: ""

syncWaves:
  config: "0"
  migrations: "1"
  recurringPreflight: "2"
  deployment: "2"
  worker: "2"
  mediaCronJobs: "3"
  smsReconciliation: "3"
  billingWorker: "3"
  recurringRuntime: "4"

application:
  configMapName: django-config
  secretName: django-secrets
  emailSecretName: django-email-secrets
  # Standalone generated-secret file (KSOPS: secrets/citrus/citrus-app-key.enc.yaml)
  # holding a real DJANGO_SECRET_KEY, encrypted with the public age recipient only.
  # dev overrides this with citrus-dev-app-key in values-dev.yaml.
  generatedSecretName: citrus-app-key
  spacesSecretName: django-spaces-secrets
  rolloutOnConfigChange: true
  # Citrus performs blocking network I/O in request handlers. Keep the process
  # count bounded for the pod's CPU limit while allowing unrelated requests to
  # make progress when one thread is waiting on an upstream service.
  command: >-
    exec gunicorn Mycore.wsgi:application --bind 0.0.0.0:8000 --worker-class
    gthread --workers 2 --threads 4 --timeout 60 --access-logfile -
  configData:
    DJANGO_DEBUG: "False"
    SITE_NAME: "Citrus Grace"
    DB_SCHEMA: "citrus"
    ALLOWED_HOSTS: "citrus-grace.com,www.citrus-grace.com"
    CSRF_TRUSTED_ORIGINS: "https://citrus-grace.com,https://www.citrus-grace.com"
    DEFAULT_FROM_EMAIL: "orders@citrus-grace.com"
    MEDIA_EMAIL: "media@citrus-grace.com"
    HELP_EMAIL: "help@citrus-grace.com"
    ORDERS_EMAIL: "orders@citrus-grace.com"
    BUSINESS_TIME_ZONE: "America/Chicago"
    CACHE_URL: "redis://citrus-redis:6379/0"
    CELERY_BROKER_URL: "redis://citrus-redis:6379/1"
    CELERY_TASK_ALWAYS_EAGER: "False"
    CELERY_TASK_DEFAULT_QUEUE: "media"
    CELERY_BROKER_VISIBILITY_TIMEOUT: "3600"
    CELERY_TASK_SOFT_TIME_LIMIT: "240"
    CELERY_TASK_TIME_LIMIT: "300"
    RECURRING_BILLING_QUEUE: "billing"
    RECURRING_ORDER_ENROLLMENT_MODE: "off"
    RECURRING_ORDER_ENROLLMENT_ALLOWLIST: ""
    RECURRING_ORDER_COHORT_MODE: "off"
    RECURRING_ORDER_COHORT_ALLOWLIST: ""
    RECURRING_REMINDERS_ENABLED: "False"
    RECURRING_CHARGING_ENABLED: "False"
    RECURRING_CHARGE_EMERGENCY_STOP: "True"
    RECURRING_OUTBOX_CLAIM_STALE_SECONDS: "900"
    RECURRING_RUNTIME_DEFER_SECONDS: "300"
    RECURRING_PAYMENT_RECONCILE_AFTER_SECONDS: "900"
    RECURRING_RUNTIME_OUTBOX_AGE_ALERT_SECONDS: "900"
    RECURRING_RUNTIME_QUEUE_DEPTH_ALERT: "100"
    RECURRING_RUNTIME_OVERDUE_GRACE_SECONDS: "600"
    RECURRING_NOTICE_FAILURE_ALERT_WINDOW_SECONDS: "3600"
    MEDIA_UPLOAD_MAX_BYTES: "10485760"
    MEDIA_COMPRESSION_MAX_IMAGE_PIXELS: "50000000"
    MEDIA_COMPRESSION_ENABLED: "True"
    MEDIA_GALLERY_MAX_BATCH: "25"
    RATELIMIT_USE_CACHE: "default"
    # ingress-nginx reaches Citrus from the DOKS pod network and replaces any
    # client-supplied X-Forwarded-For value with the source address it observes.
    # Citrus still walks the chain from right to left and trusts it only when
    # REMOTE_ADDR belongs to this managed cluster pod CIDR.
    TRUST_X_FORWARDED_FOR: "True"
    TRUSTED_PROXY_IPS: "10.244.0.0/16"
    EMAIL_HOST: "smtp-relay.gmail.com"
    EMAIL_PORT: "587"
    EMAIL_USE_TLS: "True"
    EMAIL_USE_AUTH: "False"
    EMAIL_TIMEOUT: "10"
    AWS_STORAGE_BUCKET_NAME: "citrus-media"
    AWS_S3_ENDPOINT_URL: "https://nyc3.digitaloceanspaces.com"
    AWS_S3_REGION_NAME: "nyc3"
    AWS_S3_CUSTOM_DOMAIN: "citrus-media.nyc3.cdn.digitaloceanspaces.com"
    AWS_QUERYSTRING_AUTH: "False"
    AWS_DEFAULT_ACL: "public-read"
    AWS_S3_CACHE_CONTROL: "max-age=86400, public"

# Disabled preparation for CES-829. Confidential issuer, audience, and identity
# values must live in the dedicated Secret and are projected only into the web
# container after an exact source-image receipt is supplied.
cloudflareAccess:
  enabled: false
  owner: ""
  secretName: ""
  rolloutRevision: ""
  verifiedImageTag: ""

# Disabled-by-default CES-844 contract. The dev Application layers its explicit
# test-mode overlay; production keeps this base disabled.
paymentCredentials:
  enabled: false
  secretName: ""
  owner: ""
  rolloutRevision: ""
  webhookEnvironmentVariable: ""
  webhookSecretName: ""
  webhookSecretKey: ""

# Disabled-by-default CES-845 contract. Enabling it injects explicit runtime
# ownership into every Citrus process and renders same-release Cilium egress
# policies before migrations or serving workloads. Base and production values
# remain disabled; an environment overlay may activate the contract explicitly.
paymentSafety:
  enabled: false
  environment: ""
  owner: ""
  networkMode: ""
  policy:
    required: false
    provider: ""
    revision: ""
  networkPolicy:
    enabled: false
    syncWave: "-1"
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    database:
      # DB_HOST is secret-backed and cannot safely be inferred by Helm. Supply
      # its exact hostname only in a separately reviewed activation change.
      host: ""
      port: 25060
    # Exact non-Stripe destinations needed only by enabled features whose
    # endpoint is not already chart-owned (for example CAPTCHA or internal
    # notifications). Wildcards and Stripe domains are rejected.
    additionalExternalEgress: []


service:
  name: citrus-service
  type: ClusterIP
  port: 80
  targetPort: 8000

persistence:
  enabled: false
  mountEnabled: false
  name: django-media-pvc
  storageClassName: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce
  mountPath: /citrus/media

migrations:
  enabled: true
  backoffLimit: 3
  command:
    - python
    - manage.py
    - migrate
    - --noinput

worker:
  enabled: true
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  command: >-
    exec celery -A Mycore worker --loglevel=INFO --queues=media --concurrency=1
    --prefetch-multiplier=1 --max-tasks-per-child=20 --soft-time-limit=240
    --time-limit=300
  terminationGracePeriodSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 750m
      memory: 1Gi

# Disabled until the CES-712 source image is pinned and the staged cohort is
# approved. This worker never consumes the media queue.
billingWorker:
  enabled: false
  # Must match the preflight, tick, and health revision when the recurring
  # runtime is enabled. It is intentionally empty in every deployed overlay.
  topologyRevision: ""
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  terminationGracePeriodSeconds: 300
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
  metrics:
    enabled: true
    port: 9109
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 256Mi

# The CronJobs read persisted UTC due timestamps. Their schedules are only
# bounded wake-ups; no Thursday/Friday business policy belongs here.
recurringRuntime:
  enabled: false
  # Must equal image.tag before any recurring component can render. The source
  # preflight compares this expected revision with the revision baked into the
  # image by the trusted Citrus build workflow.
  expectedSourceRevision: 3f68967f777b2665fccb4f0ab423f339b8ea1357
  # The scheduler and per-workload revisions are an explicit, nonsecret
  # topology attestation. All four revisions must match before Helm will render
  # any recurring controller.
  scheduler: kubernetes-cronjob
  topologyRevision: ""
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  activeDeadlineSeconds: 240
  backoffLimit: 1
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  command:
    - python
    - manage.py
    - tick_recurring_orders
    - --scan-limit=100
    - --dispatch-limit=100
  preflight:
    enabled: false
    topologyRevision: ""
    activeDeadlineSeconds: 240
    backoffLimit: 0
    command:
      - python
      - manage.py
      - preflight_recurring_runtime
      - --include-broker
      - --format=json
  health:
    enabled: true
    topologyRevision: ""
    schedule: "2-59/5 * * * *"
    command:
      - python
      - manage.py
      - check_recurring_runtime
      - --include-broker
      - --format=json
      - --fail-on-alert
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Prepared by CES-848. No compatible least-privilege runtime artifact or Secret
# exists yet, so both real environments remain disabled, suspended, and empty
# of activation receipts pending CES-844, CES-845, and CES-849.
smsReconciliation:
  enabled: false
  suspend: true
  secretName: ""
  verifiedImageTag: ""
  commandCompatibleImageTags: []
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 240
  activeDeadlineSeconds: 240
  backoffLimit: 1
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  staleMinutes: 15
  limit: 100
  # Dormant until a separately reviewed activation supplies an exact DB FQDN
  # and policy receipt. No provider or world egress is configurable here.
  networkPolicy:
    enabled: false
    provider: ""
    revision: ""
    syncWave: "2"
    dns:
      namespace: kube-system
      podLabels:
        k8s-app: kube-dns
    database:
      host: ""
      port: 25060
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

mediaRequeue:
  enabled: true
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  backoffLimit: 2
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  command:
    - python
    - manage.py
    - enqueue_pending_media
    - --stale-minutes=10
    - --limit=100
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

mediaGc:
  enabled: true
  schedule: "22 8 * * *"
  concurrencyPolicy: Forbid
  backoffLimit: 2
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  command:
    - python
    - manage.py
    - collect_orphan_media
    - --dry-run
    - --limit=100
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

directOrderPaymentSweep:
  # Any enabled render is already safe to unsuspend out of band: it requires a
  # command-bearing immutable image receipt, isolated payment credentials, the
  # payment Cilium boundary, and a dedicated DB/app-key runtime Secret.
  enabled: false
  suspend: true
  runtimeSecretName: ""
  verifiedImageTag: ""
  offSessionMode: legacy
  # Stagger from the CES-848 quarter-hour SMS sweep, recurring tick/health,
  # and media wakeups so prepared jobs do not create synchronized CPU bursts.
  schedule: "3-59/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 840
  activeDeadlineSeconds: 600
  backoffLimit: 1
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  staleMinutes: 15
  limit: 100
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

terminationGracePeriodSeconds: 60

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsGroup: 10001
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

redis:
  enabled: true
  name: citrus-redis
  replicas: 1
  nodeSelector:
    doks.digitalocean.com/node-pool: pool-garz-memory
  persistence:
    enabled: true
    name: citrus-redis-data
    storageClassName: do-block-storage-retain
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  image:
    repository: redis
    tag: "7.2.4-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: true
  name: citrus-ingress
  className: ""
  annotations:
    external-dns.alpha.kubernetes.io/controller: "manual"
    kubernetes.io/ingress.class: "legacy-nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    acme.cert-manager.io/http01-edit-in-place: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - citrus-grace.com
    - www.citrus-grace.com
  tls:
    enabled: true
    secretName: citrus-grace-tls

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
