# Production values for splattop.
# This file contains production-specific overrides for the default values.yaml
# Use with: helm install splattop ./helm/splattop -f ./helm/splattop/values-prod.yaml

# Global configuration
global:
  environment: production

# FastAPI backend configuration
  appImageTag: v2.0.39
fastapi:
  replicas: 2
  # Reserve typical CPU use while allowing burst above it; no CPU limit.
  resources:
    requests:
      cpu: 150m
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
          - key: doks.digitalocean.com/node-pool
            operator: In
            values:
            - pool-garz-ai
  env:
    COMP_LEADERBOARD_ENABLED: "true"
  service:
    extraServices:
    - name: fast-api-app-service
      ports:
      - name: http
        port: 8000
        targetPort: 8000
      - name: websocket
        port: 8001
        targetPort: 8001
      selector:
        app.kubernetes.io/component: fastapi
        app.kubernetes.io/instance: splattop-prod
        app.kubernetes.io/name: splattop

# React frontend configuration
  image:
    tag: v2.0.39
react:
  replicas: 2
  resources:
    requests:
      cpu: 5m
  service:
    extraServices:
    - name: react-app-service
      ports:
      - name: http
        port: 80
        targetPort: 80
      selector:
        app.kubernetes.io/component: react
        app.kubernetes.io/instance: splattop-prod
        app.kubernetes.io/name: splattop

# Celery worker configuration
  image:
    tag: v2.0.38
celeryWorker:
  nodeSelector:
    doks.digitalocean.com/node-pool: pool-garz-memory
  # Reserve typical CPU use; concurrency and burst capacity stay unchanged.
  resources:
    requests:
      cpu: 150m
  # Let in-flight tasks finish during future moves. The initial migration must
  # separately quiesce the old pod, which still has its previous 30-second grace.
  terminationGracePeriodSeconds: 600
  env:
    COMP_LEADERBOARD_ENABLED: "true"

# Celery beat configuration
  image:
    tag: v2.0.39
celeryBeat:
  env:
    COMP_LEADERBOARD_ENABLED: "true"

# Redis compatibility service overrides
  image:
    tag: v2.0.39
redis:
  service:
    extraServices:
    - name: redis
      ports:
      - name: redis
        port: 6379
        targetPort: 6379
      selector:
        app.kubernetes.io/component: redis
        app.kubernetes.io/instance: splattop-prod
        app.kubernetes.io/name: splattop

# SplatNLP compatibility service overrides
splatnlp:
  # Retired in production: the service has no active consumers and its loaded
  # model held roughly 529 MiB of working-set memory continuously.
  enabled: false
  service:
    extraServices:
    - name: splatnlp-service
      ports:
      - name: http
        port: 9000
        targetPort: 9000
      selector:
        app.kubernetes.io/component: splatnlp
        app.kubernetes.io/instance: splattop-prod
        app.kubernetes.io/name: splattop

# Ingress configuration
ingress:
  enabled: true
  nameOverride: prod-ingress
  hosts:
  - host: splat.top
    paths:
    - path: /.well-known/
      pathType: Prefix
      serviceName: fastapi
      serviceNameOverride: fast-api-app-service
      servicePort: 8000
    - path: /api
      pathType: Prefix
      serviceName: fastapi
      serviceNameOverride: fast-api-app-service
      servicePort: 8000
    - path: /ws
      pathType: Prefix
      serviceName: fastapi
      serviceNameOverride: fast-api-app-service
      servicePort: 8001
    - path: /
      pathType: Prefix
      serviceName: react
      serviceNameOverride: react-app-service
      servicePort: 80
  - host: comp.splat.top
    paths:
    - path: /.well-known/
      pathType: Prefix
      serviceName: fastapi
      serviceNameOverride: fast-api-app-service
      servicePort: 8000
    - path: /api
      pathType: Prefix
      serviceName: fastapi
      serviceNameOverride: fast-api-app-service
      servicePort: 8000
    - path: /ws
      pathType: Prefix
      serviceName: fastapi
      serviceNameOverride: fast-api-app-service
      servicePort: 8001
    - path: /
      pathType: Prefix
      serviceName: react
      serviceNameOverride: react-app-service
      servicePort: 80
  tls:
    enabled: true
    secretName: tls-secret
    certificate:
      enabled: false
