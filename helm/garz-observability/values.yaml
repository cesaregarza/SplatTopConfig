nameOverride: splattop
fullnameOverride: splattop-prod

# Preserve the live selector labels until CES-257 performs the explicit
# Prometheus/Grafana state-preservation cutover. Changing these labels would
# force immutable Deployment/StatefulSet selector changes.
legacySelectorLabels:
  name: splattop
  instance: splattop-prod

monitoring:
  namespace: monitoring
  createNamespace: true
  networkPolicies:
    defaultDeny:
      enabled: true
    acmeSolver:
      enabled: true
      ingressNamespace: ingress-nginx
    grafana:
      enabled: true
      allowedIngressNamespaces:
      - ingress-nginx
      - monitoring
      databaseCIDR: 10.108.0.0/20
      databasePort: 25060
      extraEgress: []
    prometheus:
      enabled: true
      citrusDevMetrics: false
      allowedIngressNamespaces:
      - monitoring
      - ingress-nginx
      allowedEgressNamespaces:
      - monitoring
      - default
      - ingress-nginx
      extraEgress: []
    kube_state_metrics:
      enabled: true
    alertmanager:
      enabled: true
      outboundCIDR: 0.0.0.0/0
      outboundPort: 443
  cilium:
    prometheusEgressKubeAPI:
      enabled: false

  # Prometheus configuration
  prometheus:
    enabled: false
    replicas: 1
    nodeSelector: {}
    image:
      repository: prom/prometheus
      tag: v2.52.0
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 9090
      extraServices:
      - name: prometheus
        ports:
        - name: http
          port: 9090
          targetPort: http
    configMapName: prometheus-config
    retention: 15d
    # Keep the Go runtime below the 2 GiB container limit so Prometheus retains
    # headroom for queries, WAL replay, and compaction instead of relying on the
    # cgroup OOM killer.
    goMemoryLimit: 1200MiB
    query:
      # Quote large integers so Helm does not render them in scientific
      # notation, which Prometheus's integer flag parser does not accept.
      # The supported 14-day history path returns one bounded recording series
      # at a time.  Keep two engine slots so alert rules are not starved by one
      # operator query, while rejecting the broad raw joins that caused the
      # CES-856 OOM before they can consume the old five-million-sample budget.
      maxSamples: "500000"
      maxConcurrency: 2
      timeout: 30s
    querySafety:
      # The group-level cap fails a rule whose output cardinality grows beyond
      # its reviewed envelope. It does not limit expression inputs; fixed
      # selectors plus query.maxSamples provide that engine guard. The runbook
      # further requires exact selectors and one operator query at a time.
      recordingInterval: 15s
      maxSeriesPerRule: 20
      # 75% of the existing 2 GiB container limit.  This leaves 512 MiB for
      # query, mmap, WAL replay, and compaction pressure before cgroup OOM.
      memoryPressureThresholdBytes: "1610612736"
    fastapiScrape:
      # The SplatTop application runs in default while this chart is released
      # into monitoring, so discovery must not use .Release.Namespace.
      namespace: default
      # This is per target. Two FastAPI replicas can expose at most 30k samples
      # per scrape, while a runaway per-player label cannot return hundreds of
      # thousands of samples to Prometheus again.
      sampleLimit: 15000
    kubeletScrape:
      enabled: false
    staticScrapeConfigs: []
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    rules:
      enabled: false
      configMapName: prometheus-rules

  # kube-state-metrics exposes Kubernetes object state for alerting and
  # reservation right-sizing. Leave watched_namespaces empty to watch all
  # namespaces with a ClusterRole.
  kube_state_metrics:
    enabled: false
    replicas: 1
    image:
      repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
      tag: v2.19.1
      pull_policy: IfNotPresent
    watched_namespaces: []
    # Expose only the Job labels required to bind a smoke-gate failure to the
    # exact Citrus source revision and the reviewed verification step. Avoid
    # wildcard label export because it expands cardinality and can surface
    # unrelated workload metadata.
    job_label_allowlist:
      - app.kubernetes.io/component
      - citrus.grace/source-revision
      - citrus.grace/smoke-step
    resources_to_collect:
      - pods
      - nodes
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - jobs
    service:
      type: ClusterIP
      port: 8080
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

  # Grafana configuration
  grafana:
    enabled: false
    nodeSelector: {}
    replicas: 1
    image:
      repository: grafana/grafana
      tag: 10.4.3
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 80
      extraServices:
      - name: grafana
        ports:
        - name: http
          port: 80
          targetPort: http
    adminUser: admin
    adminCredentialsSecret: grafana-admin-credentials
    adminCredentials:
      create: false
      username: admin
      password: admin
    serverDomain: ""
    serverRootUrl: ""
    plugins: []
    auth:
      anonymous: false
    metrics:
      enabled: true
    ingress:
      enabled: false
      nameOverride: ""
      className: nginx
      annotations: {}
      hosts: []
      tls:
        enabled: false
        secretName: grafana-tls
    vanityHosts: []
    #   - host: stats.grafana.splat.top
    #     target: https://grafana.splat.top/d/abc123/my-dashboard
    #     code: 302 # optional; defaults to 302
    #     tlsSecretName: grafana-tls # optional; defaults to the main Grafana TLS secret
    #     cloudflareProxied: true # optional; sets external-dns per-host proxy flag
    datasourcesConfigMapName: grafana-datasources
    dashboardProvidersConfigMapName: grafana-dashboard-providers
    dashboards:
    - name: core
      configMapName: grafana-dashboard-core
      dataKey: splattop-overview.json
    - name: splatgpt
      configMapName: grafana-dashboard-splatgpt
      dataKey: splatgpt-operations.json
    - name: auth-rate
      configMapName: grafana-dashboard-auth-rate
      dataKey: auth-and-rate.json
    - name: realtime
      configMapName: grafana-dashboard-realtime
      dataKey: realtime-channels.json
    - name: ripple
      configMapName: grafana-dashboard-ripple
      dataKey: ripple-performance.json
    - name: api-usage
      configMapName: grafana-dashboard-api-usage
      dataKey: api-usage-pipeline.json
    - name: data-pipeline
      configMapName: grafana-dashboard-data-pipeline
      dataKey: data-pipelines.json
    persistence:
      enabled: true
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # AlertManager configuration
  alertmanager:
    enabled: false
    replicas: 1
    affinity: {}
    image:
      repository: prom/alertmanager
      tag: v0.27.0
      pullPolicy: IfNotPresent
    service:
      type: ClusterIP
      port: 9093
      extraServices:
      - name: alertmanager
        ports:
        - name: http
          port: 9093
          targetPort: http
    configSecret: alertmanager-config
    config:
      create: false
      content: |
        global:
          resolve_timeout: 5m

        route:
          receiver: dev-log

        receivers:
          - name: dev-log
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
