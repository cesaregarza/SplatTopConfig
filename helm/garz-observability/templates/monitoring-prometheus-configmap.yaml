{{- if .Values.monitoring.prometheus.enabled }}
{{- $fullName := include "garzObservability.fullname" . -}}
{{- $configMapName := default (printf "%s-prometheus-config" $fullName) .Values.monitoring.prometheus.configMapName -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $configMapName }}
  namespace: {{ include "garzObservability.monitoringNamespace" . }}
  labels:
    {{- include "garzObservability.componentLabels" (dict "component" "prometheus-config" "root" .) | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: fastapi
        metrics_path: /metrics
        sample_limit: {{ .Values.monitoring.prometheus.fastapiScrape.sampleLimit }}
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - action: keep
            source_labels: [__meta_kubernetes_namespace]
            regex: {{ .Values.monitoring.prometheus.fastapiScrape.namespace | quote }}
          - action: keep
            source_labels:
              - __meta_kubernetes_service_name
              - __meta_kubernetes_endpoint_port_name
            regex: fast-api-app-service;http

      - job_name: grafana
        metrics_path: /metrics
        static_configs:
          - targets:
              - grafana.monitoring.svc.cluster.local:80

      - job_name: alertmanager
        metrics_path: /metrics
        static_configs:
          - targets:
              - alertmanager.monitoring.svc.cluster.local:9093

{{- if .Values.monitoring.prometheus.kubeletScrape.enabled }}
      - job_name: kubernetes-cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

      - job_name: kubernetes-kubelet
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics

{{- end }}
{{- if .Values.monitoring.kube_state_metrics.enabled }}
      - job_name: kube-state-metrics
        metrics_path: /metrics
        static_configs:
          - targets:
              - {{ printf "%s-kube-state-metrics.%s.svc.cluster.local:%v" $fullName (include "garzObservability.monitoringNamespace" .) (.Values.monitoring.kube_state_metrics.service.port | int) | quote }}

{{- end }}
{{- range $scrape := .Values.monitoring.prometheus.staticScrapeConfigs }}
      - job_name: {{ $scrape.jobName | quote }}
        metrics_path: {{ default "/metrics" $scrape.metricsPath | quote }}
        {{- with $scrape.scheme }}
        scheme: {{ . | quote }}
        {{- end }}
        {{- with $scrape.scrapeInterval }}
        scrape_interval: {{ . | quote }}
        {{- end }}
        static_configs:
          - targets:
            {{- range $target := $scrape.targets }}
              - {{ $target | quote }}
            {{- end }}
            {{- with $scrape.labels }}
            labels:
              {{- toYaml . | nindent 14 }}
            {{- end }}

{{- end }}
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - action: keep
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            regex: "true"
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_path
            target_label: __metrics_path__
            regex: (.+)
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_annotation_prometheus_io_scheme
            target_label: __scheme__
            regex: (https?)
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_ip
              - __meta_kubernetes_pod_annotation_prometheus_io_port
            target_label: __address__
            regex: (.+);(\d+)
            replacement: ${1}:${2}
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
{{- end }}
